
name: Build Emerald Optimizer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract project
        run: |
          unzip -q EmeraldOptimizer-Source.zip -d extracted

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-7.3.3-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp

      - name: Build JAR
        working-directory: extracted/emerald_optimizer_build_20261119
        run: /tmp/gradle-7.3.3/bin/gradle --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: Emerald-Optimizer-JAR
          path: extracted/emerald_optimizer_build_20261119/build/libs/*.jar
